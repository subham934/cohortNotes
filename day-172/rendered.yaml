apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: ai-deployment
  name: ai-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
        - image: ai-orchestration:afc59f0f
          livenessProbe:
            httpGet:
              path: /api/status/healthz
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          name: ai-server
          ports:
            - containerPort: 3000
              name: ai-server-port
          readinessProbe:
            httpGet:
              path: /api/status/healthz
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256M
            requests:
              cpu: 250m
              memory: 128M
---
apiVersion: v1
kind: Service
metadata:
  labels:
    name: ai-service
  name: ai-service
spec:
  ports:
    - name: ai-http
      port: 80
      targetPort: 3000
  selector:
    app: ai-server
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: sandbox-deployment
  name: sandbox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      containers:
        - image: sandbox:afc59f0f
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          name: main-sandbox-container
          ports:
            - containerPort: 3000
              name: main-sandbox
          readinessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 400Mi
            requests:
              cpu: 250m
              memory: 200Mi
      serviceAccountName: resource-manager
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-service
spec:
  ports:
    - name: main-sandbox-port
      port: 80
      targetPort: 3000
  selector:
    app: sandbox
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/name: codespace-ingress
  name: codespace-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - backend:
              service:
                name: sandbox-service
                port:
                  number: 80
            path: /api/sandbox
            pathType: Prefix
    - http:
        paths:
          - backend:
              service:
                name: ai-service
                port:
                  number: 80
            path: /api/ai
            pathType: Prefix
    - host: '*.preview.localhost'
      http:
        paths:
          - backend:
              service:
                name: router-service
                port:
                  number: 80
            path: /
            pathType: Prefix
    - host: '*.agent.localhost'
      http:
        paths:
          - backend:
              service:
                name: router-service
                port:
                  number: 80
            path: /
            pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: router-deployment
  name: router-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
        - image: router:afc59f0f
          livenessProbe:
            httpGet:
              path: /api/status/healthz
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          name: router-server
          ports:
            - containerPort: 3000
              name: my-name
          readinessProbe:
            httpGet:
              path: /api/status/readyz
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 500M
            requests:
              cpu: 250m
              memory: 250M
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: router
  name: router-service
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app: router
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resource-manager
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resource-manager-binding
subjects:
  - kind: ServiceAccount
    name: resource-manager
    namespace: default
---
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resource-manager
