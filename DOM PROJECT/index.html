<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Productivity Dashboard</title>
  </head>
  <body>
    <div id="main">
      <section class="allElems">
        <div class="elem todo" id="0">
          <img
            src="https://images.unsplash.com/photo-1622547748225-3fc4abd2cca0?q=80&w=1032&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>To do list</h2>
        </div>
        <div class="elem daily" id="1">
          <img
            src="https://images.unsplash.com/photo-1769292169556-2029133158ea?q=80&w=464&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>Daily Planner</h2>
        </div>
        <div class="elem moti" id="2">
          <img
            src="https://plus.unsplash.com/premium_vector-1721569648469-97f6c6017148?q=80&w=580&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>Motivation</h2>
        </div>
        <div class="elem pomo" id="3">
          <img
            src="https://images.unsplash.com/photo-1563387852576-964bc31b73af?q=80&w=907&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>Pomodoro Timer</h2>
        </div>
        <div class="elem goals" id="4">
          <img
            src="https://images.unsplash.com/photo-1662869633285-13fe05236a72?q=80&w=860&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>Daily Goals</h2>
        </div>
      </section>

      <section class="fullElem todo-list-fullpage">
        <button class="back" id="0">Close</button>
        <h2>Your Personalized Task List</h2>

        <div class="todo-container">
            <div class="addTask">
                <form>
                    <input id="task-input" type="text" placeholder="Enter Task">
                    <textarea name="" cols="30" rows="10" placeholder="Enter Details" id=""></textarea>
                    <div class="mark-imp">
                        <input type="checkbox" id="check">
                        <label for="check">Mark as Important!</label>
                    </div>
                    <button>Add Task</button>
                </form>
            </div>
            <div class="allTask">
                
            </div>
        </div>
      </section>

      <section class="fullElem daily-planner-fullpage">
        <button class="back" id="1">Close</button>
        <h2>Plan Your Day to be more Productive</h2>

        <div class="day-planner">
            
        </div>
      </section>

      <section class="fullElem motivational-fullpage">
        <button class="back" id="2">Close</button>
        <h2>Motivational Quote</h2>

        <div class="motivation-container">
            <div class="motivation-wrapper">
                <img src="./quote.png" alt="">
                <div class="motivation-1">
                    <h2>Quote of the Day</h2>
                </div>

                <div class="motivation-2">
                     <h1></h1>
                </div>

                <div class="motivation-3">
                    <h2></h2>
                </div>
            </div>
        </div>
      </section>

      <section class="fullElem pomodoro-fullpage">
        <button class="back" id="3">Close</button>
        <h2>Study With Me!!</h2>

        <div class="pomo-timer">
            <h1>25:00</h1>
            <button class="start-timer">Start</button>
            <button class="pause-timer">Pause</button>
            <button class="reset-timer">Reset</button>
        </div>
      </section>

      <section class="fullElem daily-goals-fullpage">
        <button class="back" id="4">Close</button>
        <h1>Daily Goals</h1>
      </section>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
